name: SCN Viewer - Windows telepítő

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Windows 11 asztali telepítő (EXE)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása (csak a fordításhoz)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Függőségek telepítése
        run: npm install --no-audit --no-fund

      - name: Forrás és helyi API tesztek
        run: npm test

      - name: Offline 3D felület készítése
        run: npm run build

      - name: SCN Viewer ikon készítése
        run: python tools/make_icon.py

      - name: Önálló Windows alkalmazás csomagolása (Electron)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw 'Electron packaging failed' }
          $app = 'packed/win-unpacked/SCN Viewer.exe'
          if (-not (Test-Path $app)) { throw 'Desktop executable not found' }
          if ((Get-Item $app).Length -lt 10000000) { throw 'Invalid desktop executable size' }
          if (-not (Test-Path 'packed/win-unpacked/resources/app.asar')) { throw 'Missing Electron application archive' }

      - name: Inno Setup 6 telepítő fordítása
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress --yes
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not found' }
          & $compiler installer/SCN_Viewer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup error: $LASTEXITCODE" }
          if (-not (Test-Path 'output/SCN_Viewer_v1.7.0_Telepito.exe')) { throw 'Installer missing' }
          Get-ChildItem output/*.exe | Select-Object Name,Length

      - name: EXE telepítő az Artifacts részbe
        uses: actions/upload-artifact@v4
        with:
          name: SCN_Viewer_v1.7.0_Telepito
          path: output/SCN_Viewer_v1.7.0_Telepito.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
